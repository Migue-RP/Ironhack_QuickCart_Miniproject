version: 2

models:

  # =========================
  # STG_CUSTOMERS
  # =========================
  - name: stg_customers
    description: >
      Cleaned staging model for customers data.
      Standardizes customer attributes and formats country values.

    columns:

      - name: customer_id
        description: Unique identifier for each customer.
        tests:
          - unique
          - not_null

      - name: customer_name
        description: Full name of the customer.
        tests:
          - not_null

      - name: customer_email
        description: Customer email address.
        tests:
          - unique
          - not_null

      - name: country
        description: Standardized uppercase customer country.

      - name: age
        description: Customer age in years.

      - name: signup_date
        description: Date the customer registered.

      - name: marketing_opt_in
        description: Indicates whether customer opted into marketing communications.


  # =========================
  # STG_ORDERS
  # =========================
  - name: stg_orders
    description: >
      Cleaned staging model for ecommerce orders.

    columns:

      - name: order_id
        description: Unique identifier for each order.
        tests:
          - unique
          - not_null

      - name: customer_id
        description: Foreign key referencing the customer who placed the order.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_time
        description: Timestamp when the order was placed.

      - name: payment_method
        description: Payment method used for the transaction.

      - name: discount_pct
        description: Discount percentage applied to the order.

      - name: subtotal_usd
        description: Order subtotal before discounts.

      - name: total_usd
        description: Final order total after discounts.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.01

      - name: country
        description: Standardized uppercase country where the order originated.

      - name: device
        description: Device type used to place the order.

      - name: source
        description: Marketing or acquisition source associated with the order.


  # =========================
  # STG_PRODUCTS
  # =========================
  - name: stg_products
    description: >
      Cleaned staging model for products catalog.

    columns:

      - name: product_id
        description: Unique identifier for each product.
        tests:
          - unique
          - not_null

      - name: product_name
        description: Standardized product name.
        tests:
          - not_null

      - name: category
        description: Standardized uppercase product category.
        tests:
          - not_null

      - name: price_usd
        description: Retail selling price in USD.

      - name: cost_usd
        description: Product cost in USD.


  # =========================
  # STG_ORDER_ITEMS
  # =========================
  - name: stg_order_items
    description: >
      Cleaned staging model for order line items.

    columns:

      - name: order_id
        description: Foreign key referencing the parent order.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        description: Foreign key referencing the purchased product.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: quantity
        description: Quantity of the product purchased in the order.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

      - name: unit_price_usd
        description: Unit selling price in USD.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.01

      - name: line_total_usd
        description: Total revenue generated by the line item.
        tests:
          - not_null