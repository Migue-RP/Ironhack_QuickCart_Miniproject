version: 2

models:

  # =========================
  # INT_CATEGORY_REVENUE
  # =========================
  - name: int_category_revenue
    description: >
      Aggregated revenue metrics by product category.
      Calculates total sales and percentage contribution
      of each category to overall revenue.

    columns:

      - name: category
        description: Product category in uppercase standardized format.
        tests:
          - not_null

      - name: total_sales
        description: Total revenue generated by products in the category.
        tests:
          - not_null

      - name: revenue_contribution
        description: Percentage contribution of the category to total company revenue.


  # =========================
  # INT_CONSECUTIVE_MONTH_CUSTOMERS
  # =========================
  - name: int_consecutive_month_customers
    description: >
      Identifies customers who placed orders in consecutive months.

    columns:

      - name: customer_id
        description: Customer identifier with consecutive monthly purchases.
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id


  # =========================
  # INT_CUSTOMER_REVENUE
  # =========================
  - name: int_customer_revenue
    description: >
      Aggregated customer-level revenue metrics.
      Calculates lifetime revenue generated by each customer.

    columns:

      - name: customer_id
        description: Unique customer identifier.
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: total_revenue
        description: Total revenue generated by the customer.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0


  # =========================
  # INT_MONTHLY_SALES
  # =========================
  - name: int_monthly_sales
    description: >
      Monthly aggregated sales metrics.
      Includes month-over-month sales comparisons and growth percentages.

    columns:

      - name: sales_year
        description: Calendar year of the sales period.
        tests:
          - not_null

      - name: sales_month
        description: Calendar month of the sales period.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12

      - name: total_sales
        description: Total revenue generated during the month.
        tests:
          - not_null

      - name: previous_month_sales
        description: Total revenue generated in the previous month.

      - name: sales_growth_percentage
        description: Month-over-month percentage change in sales revenue.


  # =========================
  # INT_PRODUCTS_NEVER_ORDERED
  # =========================
  - name: int_products_never_ordered
    description: >
      Identifies products that have never appeared in any order.
      Useful for inventory and catalog optimization analysis.

    columns:

      - name: product_id
        description: Product identifier for products never purchased.
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: product_name
        description: Name of the product never ordered.
        tests:
          - not_null