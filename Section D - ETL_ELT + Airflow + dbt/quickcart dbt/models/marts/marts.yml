version: 2

models:

  # =========================
  # MART_HIGHEST_SELLING_PRODUCT
  # =========================
  - name: mart_highest_selling_product
    description: >
      Identifies the highest revenue-generating product per category.

    columns:

      - name: category
        description: Product category.
        tests:
          - not_null

      - name: product_name
        description: Name of the top-selling product within each category.
        tests:
          - not_null


  # =========================
  # MART_RANK_CUSTOMERS
  # =========================
  - name: mart_rank_customers
    description: >
      Ranks customers based on total lifetime revenue.

    columns:

      - name: customer_id
        description: Unique identifier for each customer.
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: total_revenue
        description: Total revenue generated by the customer.
        tests:
          - not_null

      - name: customer_rank
        description: Rank of customers based on revenue (1 = highest revenue).


  # =========================
  # MART_ROLLING_AVERAGE_7_DAYS
  # =========================
  - name: mart_rolling_average_seven_days
    description: >
      Daily sales metrics with a 7-day rolling average.

    columns:

      - name: sales_date
        description: Date of sales aggregation.
        tests:
          - unique
          - not_null

      - name: daily_revenue
        description: Total revenue generated per day.
        tests:
          - not_null

      - name: rolling_7day_avg
        description: 7-day moving average of daily revenue.


  # =========================
  # MART_RUNNING_TOTAL_SALES_MONTH
  # =========================
  - name: mart_running_total_sales_month
    description: >
      Monthly cumulative revenue trend over time.

    columns:

      - name: sales_year
        description: Year of the sales period.
        tests:
          - not_null

      - name: sales_month
        description: Month of the sales period.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12

      - name: total_sales
        description: Total revenue for the month.
        tests:
          - not_null

      - name: running_total_sales_month
        description: Cumulative revenue over time ordered by year and month.